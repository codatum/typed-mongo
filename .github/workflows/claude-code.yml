name: Claude Code
on:
  # anthropics/claude-code-action stops before running Claude unless the commenter has
  # write access to the repository, so the trigger is not open to outside users.
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
jobs:
  claude:
    # The action only responds to @claude. Skip other comments so they do not start a job
    # that holds write permissions and an ID token.
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Claude Code
        uses: anthropics/claude-code-action@f431adaf77e0fecf918431e75a2b5b45b85af002 # v1.0.283
        with:
          # This repository is public and accepts fork pull requests. Never run Claude on
          # fork code with a write token and an ID token, whoever comments.
          allow_fork_prs: "false"
          # Anthropic workload identity federation. The IDs are identifiers, not
          # credentials, and live in repository variables. The federation rule must
          # match the OIDC sub of every trigger, so it uses repo:codatum/typed-mongo:*.
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
